[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "big-white-rabbit"
version = "1.0.0"
description = "Big White Rabbit — edge-native MoE serving engine for Apple Silicon, built on llama.cpp/Metal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mlx>=0.32",
    "mlx-lm",
]

[project.optional-dependencies]
# The control-plane port (Phase 2) pulls these in; the Phase 0/1 engine needs none of them.
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "transformers>=4.44",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
bwr = "bwr.cli:main"

[tool.scikit-build]
wheel.packages = ["python/bwr"]
cmake.version = ">=3.21"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["vendor", "third_party", "build", "outputs"]

[tool.ruff.lint]
# The set the tree is clean against. Families, not cherry-picked codes, so a
# ruff upgrade that adds a rule shows up here rather than nowhere.
select = [
    "E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF",
    "PLC", "PLE", "PLW", "ASYNC", "BLE", "PIE", "ISC", "PGH",
    "YTT", "FLY", "DTZ", "LOG", "G",
]
ignore = [
    # `# noqa: BLE001 - reason` goes on EVERY broad except, enforced by
    # tests/test_noqa_markers_extended.py; ruff's own view of whether BLE001
    # would fire there does not override that.
    "RUF100",
    # Lazy imports inside functions are how heavy backends (mlx, llama) stay
    # optional at import time.
    "PLC0415",
    # Nested ifs with comments between the levels, and explicit
    # except-pass with a reason, read better than the one-liners proposed.
    "SIM102", "SIM105",
    # Ambiguous-unicode checks fire on prose in docstrings (arrows, dashes).
    "RUF001", "RUF002", "RUF003",
    # zip(strict=...) on every call is noise; the few that matter are
    # checked at the call site.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Tests catch broadly on purpose (proving no exception escapes) and use a
# module global to hand a fixture-built pool to a route stub.
"tests/*" = ["BLE001", "PLW0603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
