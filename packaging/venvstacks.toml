# venvstacks spec for the macOS app bundle's embedded Python.
#
# The menubar app spawns `bwr serve` as a child process and resolves its
# interpreter from the bundle (Sources/Server/PythonRuntime.swift):
#
#   Contents/Resources/Python/cpython-3.11/bin/python3
#   Contents/Resources/Python/framework-mlx-base/lib/python3.11/site-packages
#
# Those two paths are a hard contract -- `PythonRuntime.resolve()` tries
# $BWR_PYTHON_OVERRIDE, then that bundled path, then THROWS. There is no
# system-Python fallback, so an app without these layers cannot serve on any
# machine. `apps/bwr-mac/Scripts/build.sh` also refuses to stage unless both
# directories exist.
#
# venvstacks derives each directory from the layer name: a runtime layer is
# named verbatim, a framework layer is prefixed `framework-`. So the names
# below are chosen to land exactly on the paths above -- renaming either one
# silently produces a bundle that builds and then cannot start a server.
#
# Why bwr itself is installed here rather than copied as source: bwr has a
# compiled extension (`_bwr_metal`, built from csrc/ by scikit-build-core).
# Installing the project into the layer makes pip build that extension
# against THIS interpreter, so the .so matches the CPython that will load it.
# Copying the one from the development .venv would ship an extension built
# against a different interpreter build.

[[runtimes]]
name = "cpython-3.11"
python_implementation = "cpython@3.11.15"
requirements = []
platforms = ["macosx_arm64"]

[[frameworks]]
name = "mlx-base"
runtime = "cpython-3.11"
platforms = ["macosx_arm64"]
# bwr[serve] pulls mlx, mlx-lm and the control-plane stack (fastapi,
# uvicorn, pydantic, transformers). bwr itself is not published to an index,
# so the requirement below points at a wheel built from this worktree --
# which is also what makes pip compile `_bwr_metal` against the interpreter
# that will load it.
#
# packaging/build.py builds that wheel and substitutes its path for the
# placeholder in the requirement. The substitution is a plain string
# replace, so the placeholder must not appear anywhere else in this file,
# prose included. Why a wheel and not this directory: venvstacks locks with
# hashes and installs with `--only-binary :all:`, and pip refuses to hash a
# file:// URL that points at a directory.
requirements = [
    "big-white-rabbit[serve] @ @BWR_WHEEL@",
]
